<section class="admin-page admin-action-page">

  <div class="action-header">
    <div>
      <p class="eyebrow">Administración</p>
      <h1>Reporte Mensual</h1>
      <p>
        Consulta los principales indicadores financieros y operativos del acueducto.
      </p>
    </div>

    <a routerLink="/administrador/panel" class="btn btn-secondary">
      Volver al panel
    </a>
  </div>

  <div class="action-panel">

    <section class="report-card">
      <h2>Resumen del Periodo</h2>
      <p class="report-description">
        Información consolidada correspondiente al mes seleccionado.
      </p>
    </section>

    <section class="result-grid">

      <article
        class="result-card"
        *ngFor="let resultado of resultados">

        <h3>{{ resultado.title }}</h3>
        <strong>{{ resultado.value }}</strong>

      </article>

    </section>

  </div>

</section>
