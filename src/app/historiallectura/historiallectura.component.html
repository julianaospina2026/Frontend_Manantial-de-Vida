<div class="lectura-container">
    <div class="page-title">
        <h2><i class="fas fa-microchip"></i> Registro de Lecturas Técnicas</h2>
    </div>

    <div class="filter-panel card">
        <input type="number" [(ngModel)]="idBusqueda" placeholder="Documento o ID Cliente">
        <button (click)="buscar()" class="btn-search">Filtrar Historial</button>
    </div>

    <div class="timeline" *ngIf="historial.length > 0">
        <div class="timeline-item card" *ngFor="let item of historial">
            <div class="date-badge">{{ item.fechaProgramada | date:'shortDate' }}</div>
            <div class="item-details">
                <div class="detail-row">
                    <span class="label">Serial Medidor:</span>
                    <span class="val">{{ item.medidorSerial }}</span>
                </div>
                <div class="readings">
                    <div class="read-box">
                        <small>ANTERIOR</small>
                        <p>{{ item.lecturaAnterior }}</p>
                    </div>
                    <div class="read-box active">
                        <small>ACTUAL</small>
                        <p>{{ item.lecturaActual || '---' }}</p>
                    </div>
                </div>
                <div class="status-footer">
                    <span [class]="'status-text ' + item.estado?.toLowerCase()">{{ item.estado }}</span>
                </div>
            </div>
        </div>
    </div>

    <div *ngIf="historial.length === 0 && idBusqueda > 0 && !cargando" class="no-data">
        No se registraron lecturas para este cliente.
    </div>
</div>
