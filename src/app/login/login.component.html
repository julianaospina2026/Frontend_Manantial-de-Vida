<div class="login-page">
    <div class="login-card">
    <img src="assets/administrador.png" alt="Iniciar sesión" class="login-icon" />
    <h2>Iniciar sesión</h2>
        <p>Ingresa tu correo o cédula y contraseña para acceder.</p>
        <p *ngIf="errorMessage" class="login-error">{{ errorMessage }}</p>

    <form (submit)="onSubmit(email.value, password.value); $event.preventDefault()">
        <label for="email">Correo electrónico o cédula</label>
            <input id="email" #email type="text" placeholder="Ingresa tu correo o cédula" required />
        
        <label for="password">Contraseña</label>
        <input id="password" #password type="password" placeholder="••••••••" required />
        
        <button type="submit" class="login-button">Ingresar</button>
    </form>
</div>
</div>
