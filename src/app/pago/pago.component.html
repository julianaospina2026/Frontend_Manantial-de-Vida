<div class="pago-page">

  <!-- =======================
       HEADER
  ======================== -->
  <header class="section-title">
    <h2>
      <i class="fas fa-money-check-alt"></i>
      Recaudo de Cartera
    </h2>

    <p>
      Registre pagos manuales o electrónicos al sistema de acueducto.
    </p>
  </header>

  <!-- =======================
       FORMULARIO
  ======================== -->
  <div class="form-card card">

    <form [formGroup]="form" (ngSubmit)="registrar()">

      <div class="form-grid">

        <!-- FACTURA -->
        <div class="field">
          <label>N° Factura</label>

          <input
            type="number"
            formControlName="facturaId"
            placeholder="Ej: 5021"
          />
        </div>

        <!-- MONTO -->
        <div class="field">
          <label>Monto a Pagar</label>

          <input
            type="number"
            formControlName="monto"
            placeholder="0.00"
          />
        </div>

        <!-- MÉTODO DE PAGO -->
        <div class="field">
          <label>Método de Pago</label>

          <select formControlName="metodoPago">

            <option value="" disabled>
              Seleccione método
            </option>

            <option *ngFor="let m of metodos" [value]="m">
              {{ m }}
            </option>

          </select>
        </div>

      </div>

      <!-- =======================
           BOTONES
      ======================== -->
      <div class="footer-actions">

        <button
          type="submit"
          class="btn-submit"
          [disabled]="form.invalid || loading">

          {{ loading ? 'Guardando...' : '✔ Confirmar Pago' }}

        </button>

        <button
          type="button"
          class="btn-secondary"
          (click)="imprimirRecibo()">

          🧾 Imprimir Recibo

        </button>

        <button
          type="button"
          class="btn-secondary"
          (click)="verHistorial()">

          📜 Historial de Pagos

        </button>

      </div>

    </form>

  </div>

  <!-- =======================
       MENSAJES
  ======================== -->
  <div
    *ngIf="mensaje"
    class="alert-box"
    [class.error]="mensaje.includes('Error') || mensaje.includes('❌')">

    {{ mensaje }}

  </div>

</div>
