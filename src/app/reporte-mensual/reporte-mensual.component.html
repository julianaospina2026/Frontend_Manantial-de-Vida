</div>

  <!-- TABLA -->
  <table *ngIf="reporte" class="tabla">
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Tipo</th>
        <th>Valor</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of reporte.detalle">
        <td>{{ item.fecha }}</td>
        <td>{{ item.tipo }}</td>
        <td>{{ item.valor | currency }}</td>
      </tr>
    </tbody>
  </table>

</div>
