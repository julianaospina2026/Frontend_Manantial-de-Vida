<div class="reportes-container">
    <header class="header">
    <h1><i class="fas fa-chart-pie"></i> Informes de Gestión</h1>
    <div class="period-selector">
        <label>Seleccionar Mes:</label>
        <input type="month" [(ngModel)]="periodo" (change)="cargarEstadisticas()">
    </div>
</header>

<div class="stats-grid">
    <div class="stat-card blue">
        <div class="icon"><i class="fas fa-hand-holding-usd"></i></div>
        <div class="info">
        <h3>Recaudo del Periodo</h3>
        <p class="value">{{ recaudoTotal | currency }}</p>
    </div>
    </div>

    <div class="stat-card red">
        <div class="icon"><i class="fas fa-user-clock"></i></div>
        <div class="info">
        <h3>Usuarios en Mora</h3>
        <p class="value">{{ clientesMora }}</p>
        <small>Pendientes por pago</small>
    </div>
    </div>

    <div class="stat-card cyan">
        <div class="icon"><i class="fas fa-water"></i></div>
        <div class="info">
        <h3>Eficiencia de Red</h3>
        <p class="value">94.2%</p>
        <small>Relación consumo/captación</small>
    </div>
    </div>
</div>

  <div class="loading-overlay" *ngIf="cargando">
    <div class="spinner"></div>
</div>
</div>
